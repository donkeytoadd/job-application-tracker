name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: job-application-tracker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore job-application-tracker.sln

      - name: Build
        run: dotnet build job-application-tracker.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test job-application-tracker.sln --no-build --configuration Release --logger "trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: job-application-tracker/TestResults

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: job-application-tracker.UI

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: job-application-tracker.UI/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test -- --no-watch

      - name: Build
        run: npm run build
